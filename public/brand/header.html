<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Near Social · X header 1500x500</title><link rel="stylesheet" href="brand.css">
<style>
  .canvas { width: 1500px; height: 500px; }
  .copy { position: absolute; left: 110px; top: 70px; width: 700px; }
  .copy .wordmark { font-size: 30px; margin-bottom: 26px; color: var(--text-2); }
  .copy .wordmark img { width: 46px; height: 46px; }
  h1 { font-size: 82px; line-height: 0.98; }
  .sub { margin-top: 22px; font-size: 24px; color: var(--text-2); font-weight: 500; }
  .chips { position: absolute; left: 420px; bottom: 44px; display: flex; gap: 12px; }
  .chips .chip { font-size: 18px; padding: 9px 16px; }
  .profile { position: absolute; right: 120px; top: 54px; width: 430px; padding: 24px; transform: rotate(2deg); }
  .head { display: flex; align-items: center; gap: 12px; }
  .head .avatar { width: 52px; height: 52px; font-size: 22px; background: linear-gradient(140deg, hsl(150 72% 46%), hsl(200 70% 38%)); }
  .head b { font-size: 20px; display: block; }
  .head div span { color: var(--muted); font-size: 15px; }
  .head .avatar { color: #fff; }
  .head .btn { color: #03130c; }
  .head .btn { margin-left: auto; padding: 9px 16px; font-size: 15px; }
  .pnl { font: 700 46px/1 "Space Grotesk"; color: var(--mint); margin: 18px 0 4px; letter-spacing: -0.02em; }
  .muted { color: var(--muted); font-size: 15px; }
  svg { display: block; width: 100%; height: 110px; margin-top: 12px; }
  .signal { position: absolute; right: 600px; bottom: 40px; width: 360px; padding: 16px 18px; display: flex; align-items: center; gap: 12px; transform: rotate(-2deg); }
  .signal .avatar { width: 42px; height: 42px; font-size: 17px; background: linear-gradient(140deg, hsl(280 70% 50%), hsl(320 70% 45%)); }
  .signal .t { flex: 1; font-size: 15px; color: var(--text-2); }
  .signal .t b { color: var(--text); }
  .signal .btn { padding: 8px 14px; font-size: 14px; }
  .tip { position: absolute; right: 70px; bottom: 50px; padding: 12px 18px; font-size: 18px; color: var(--amber); font-weight: 700; transform: rotate(-3deg); }
</style></head>
<body><div class="canvas" id="art">
  <div class="copy">
    <div class="wordmark"><img src="/logo.svg" alt="">Near Social</div>
    <h1 class="display">Share calls.<br><span class="grad">Prove the profit.</span></h1>
    <p class="sub">The social network for NEAR traders.<br>Every PnL read from the chain.</p>
  </div>
  <div class="panel profile">
    <div class="head"><span class="avatar">D</span><div><b>Dragon Rider</b><span>@degen.near</span></div><span class="btn">Copy</span></div>
    <div class="pnl">+$12,480.20</div>
    <div class="muted">Total profit · 71% win rate · 30 days</div>
    <svg viewBox="0 0 300 86" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00e599" stop-opacity=".4"/><stop offset="1" stop-color="#00e599" stop-opacity="0"/></linearGradient></defs>
      <path d="M0 70 L25 66 L50 72 L75 58 L100 61 L125 46 L150 50 L175 36 L200 41 L225 27 L250 31 L275 15 L300 9 L300 86 L0 86Z" fill="url(#g)"/>
      <path d="M0 70 L25 66 L50 72 L75 58 L100 61 L125 46 L150 50 L175 36 L200 41 L225 27 L250 31 L275 15 L300 9" fill="none" stroke="#00e599" stroke-width="3" vector-effect="non-scaling-stroke"/></svg>
  </div>
  <div class="panel signal"><span class="avatar">T</span><div class="t"><b>Trench Queen</b> bought <b class="up">$BLACKDRAGON</b><br>Your size: $50</div><span class="btn">Copy buy</span></div>
  <div class="panel tip">$42.50 tipped</div>
</div></body></html>
