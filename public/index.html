<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Near Social</title>
<meta name="description" content="The social network for NEAR traders. Every profile shows real on-chain holdings, profit and trade history.">
<meta name="theme-color" content="#06100B">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="Near Social · Share calls. Prove the profit.">
<meta property="og:description" content="The social network for NEAR traders. Real holdings, profit and trades on every profile.">
<meta property="og:image" content="/brand/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@nearsocialfun">
<meta name="twitter:image" content="/brand/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap">
<link rel="stylesheet" href="/app.css">
<script>try { if (localStorage.getItem("theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}</script>
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>
<div class="layout">
  <aside class="sidebar" aria-label="Main">
    <a class="brand" href="#/"><img src="/logo.svg" alt="" width="36" height="36"><span id="brandName">Near Social</span></a>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><div class="account" id="account"></div><button class="theme-btn" data-action="theme" id="themeBtn" aria-label="Switch light or dark mode"></button></div>
  </aside>

  <main class="main" id="main" tabindex="-1">
    <div class="loading"><span class="spinner"></span></div>
  </main>

  <aside class="rail" aria-label="Highlights" id="rail"></aside>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="modal"></dialog>

<script src="/app.js"></script>
</body>
</html>
